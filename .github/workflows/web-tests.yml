name: Web Tests

on:
  schedule:
    # Executa todos os dias às 05:00 UTC (02:00 BRT)
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Permite execução manual pelo painel do GitHub
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-tests:
    name: Executar Testes Web
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Inicializar Browser Library (Playwright)
        run: |
          rfbrowser init

      - name: 🛠️ Instalar Dependências de Sistema do Playwright
        run: |
          npx playwright install-deps chromium

      - name: 🧪 Executar Testes Automatizados (Web)
        run: |
          robot -d results --variable HEADLESS:True tests/web/

      - name: 📈 Gerar Relatório de Saúde dos Testes (Job Summary)
        if: always()
        run: |
          python utils/generate_summary.py

      - name: 📊 Publicar Relatório de Testes (Artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: results/
          if-no-files-found: ignore
